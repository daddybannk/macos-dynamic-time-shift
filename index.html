<html>
    <head>
        <title>Dynamic Background</title>
        <style>
            html, body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: black;
            }

            .bg-layer {
                position: fixed;
                inset: 0;

                background-position: center;
                background-repeat: no-repeat;
                background-size: cover;

                opacity: 0;
                transition: opacity 1.5s ease;

                will-change: opacity;
            }

            .bg-visible {
                opacity: 1;
            }
        </style>
    </head>
    <body>
        <div id="bg1" class="bg-layer bg-visible"></div>
        <div id="bg2" class="bg-layer"></div>

        <noscript>Sorry, your browser does not support JavaScript!</noscript>
        <script>
            const DEFAULT_URL = "27";
            const DEFAULT_DAY_HOUR = 6;
            const DEFAULT_DAY_MINUTE = 0;
            const DEFAULT_NIGHT_HOUR = 18;
            const DEFAULT_NIGHT_MINUTE = 0;
            const DEFAULT_DAWN_TIME = "Dawn";
            const DEFAULT_DAY_TIME = "Day";
            const DEFAULT_DUSK_TIME = "Dusk";
            const DEFAULT_NIGHT_TIME = "Night";
            const DEFAULT_POSITION_Y = "50%";
            const DAY_SHIFT_ONLY_VERSION = ["10-12","10-13"];
            const FOUR_PERIOD_VERSION = ["26-Beach"];
            const DEFAULT_DAWN_HOUR = 6;
            const DEFAULT_DAWN_MINUTE = 0;
            const DEFAULT_DAY_HOUR_4 = 10;
            const DEFAULT_DAY_MINUTE_4 = 0;
            const DEFAULT_DUSK_HOUR = 17;
            const DEFAULT_DUSK_MINUTE = 0;
            const DEFAULT_NIGHT_HOUR_4 = 21;
            const DEFAULT_NIGHT_MINUTE_4 = 0;
            var myConfig = {
                version: DEFAULT_URL,
                dayHour: DEFAULT_DAY_HOUR,
                dayMinute: DEFAULT_DAY_MINUTE,
                nightHour: DEFAULT_NIGHT_HOUR,
                nightMinute: DEFAULT_NIGHT_MINUTE,
                positionY: DEFAULT_POSITION_Y,
                dawnHour: DEFAULT_DAWN_HOUR,
                dawnMinute: DEFAULT_DAWN_MINUTE,
                dayHour4: DEFAULT_DAY_HOUR_4,
                dayMinute4: DEFAULT_DAY_MINUTE_4,
                duskHour: DEFAULT_DUSK_HOUR,
                duskMinute: DEFAULT_DUSK_MINUTE,
                nightHour4: DEFAULT_NIGHT_HOUR_4,
                nightMinute4: DEFAULT_NIGHT_MINUTE_4,
            };

            let lastState = {
                imagePath: "",
                positionY: "",
            };
            let activeLayer = 1;
            let isTransitioning = false;

            const bg1 = document.getElementById("bg1");
            const bg2 = document.getElementById("bg2");

            document.addEventListener("DOMContentLoaded", function(event) { 
                changeBackground(myConfig);
                setInterval(() => {
                    changeBackground(myConfig);
                }, 2000);
            });

            function getHour() {
                const d = new Date();
                return d.getHours();
            }
            
            function getMinute() {
                const d = new Date();
                return d.getMinutes();
            }

            function isHour(number) {
                if (typeof(number) == "number" && 0 <= number && number <= 24) {
                    return true;
                } else {
                    return false;
                }
            }

            function isMinute(number) {
                if (typeof(number) == "number" && 0 <= number && number <= 59) {
                    return true;
                } else {
                    return false;
                }
            }

            function getFourPeriod(currentMin, dawnMin, dayMin, duskMin, nightMin) {
                if (currentMin >= nightMin || currentMin < dawnMin) {
                    return DEFAULT_NIGHT_TIME;
                }
                if (currentMin >= duskMin) {
                    return DEFAULT_DUSK_TIME;
                }
                if (currentMin >= dayMin) {
                    return DEFAULT_DAY_TIME;
                }
                return DEFAULT_DAWN_TIME;
            }

            function buildImagePath(config) {
                const {version, dayHour, dayMinute, nightHour, nightMinute,
                    dawnHour, dawnMinute, dayHour4, dayMinute4,
                    duskHour, duskMinute, nightHour4, nightMinute4} = config;
                let dayTime = DEFAULT_DAY_TIME;
                const settingDayHour = isHour(dayHour) ? dayHour : DEFAULT_DAY_HOUR;
                const settingDayMinute = isMinute(dayMinute) ? dayMinute : DEFAULT_DAY_MINUTE;
                const settingNightHour = isHour(nightHour) ? nightHour : DEFAULT_NIGHT_HOUR;
                const settingNightMinute = isMinute(nightMinute) ? nightMinute : DEFAULT_NIGHT_MINUTE;
                const h = getHour();
                const m = getMinute();
                let resolvedVersion = version;
                if (resolvedVersion == "") {
                    resolvedVersion = DEFAULT_URL;
                }
                if (DAY_SHIFT_ONLY_VERSION.indexOf(resolvedVersion) >= 0) {
                    return `img/${resolvedVersion}/${resolvedVersion}.jpg`;
                }
                if (FOUR_PERIOD_VERSION.indexOf(resolvedVersion) >= 0) {
                    const sDawnH = isHour(dawnHour) ? dawnHour : DEFAULT_DAWN_HOUR;
                    const sDawnM = isMinute(dawnMinute) ? dawnMinute : DEFAULT_DAWN_MINUTE;
                    const sDayH = isHour(dayHour4) ? dayHour4 : DEFAULT_DAY_HOUR_4;
                    const sDayM = isMinute(dayMinute4) ? dayMinute4 : DEFAULT_DAY_MINUTE_4;
                    const sDuskH = isHour(duskHour) ? duskHour : DEFAULT_DUSK_HOUR;
                    const sDuskM = isMinute(duskMinute) ? duskMinute : DEFAULT_DUSK_MINUTE;
                    const sNightH = isHour(nightHour4) ? nightHour4 : DEFAULT_NIGHT_HOUR_4;
                    const sNightM = isMinute(nightMinute4) ? nightMinute4 : DEFAULT_NIGHT_MINUTE_4;
                    dayTime = getFourPeriod(
                        h * 60 + m,
                        sDawnH * 60 + sDawnM,
                        sDayH * 60 + sDayM,
                        sDuskH * 60 + sDuskM,
                        sNightH * 60 + sNightM
                    );
                    return `img/${resolvedVersion}/${resolvedVersion}-${dayTime}.jpg`;
                }
                if (settingDayHour < h && h < settingNightHour) {
                    dayTime = DEFAULT_DAY_TIME;
                } else if (h == settingDayHour && settingDayMinute <= m) {
                    dayTime = DEFAULT_DAY_TIME;
                } else if (h == settingNightHour && m < settingNightMinute) {
                    dayTime = DEFAULT_DAY_TIME;
                } else {
                    dayTime = DEFAULT_NIGHT_TIME;
                }
                return `img/${resolvedVersion}/${resolvedVersion}-${dayTime}.jpg`;
            }

            function preloadImage(src) {
                return new Promise((resolve) => {
                    const img = new Image();
                    img.onload = resolve;
                    img.onerror = resolve;
                    img.src = src;
                });
            }

            async function changeBackground(config) {
                const imagePath = buildImagePath(config);
                const currentLayer = activeLayer == 1 ? bg1 : bg2;
                if (lastState.imagePath == imagePath && lastState.positionY != config.positionY) {
                    currentLayer.style.backgroundPositionY = config.positionY;
                    lastState.positionY = config.positionY;
                    return;
                }
                if (lastState.imagePath == imagePath && lastState.positionY == config.positionY) {
                    return;
                }
                lastState.imagePath = imagePath;
                lastState.positionY = config.positionY
                await preloadImage(imagePath);
                const nextLayer = activeLayer == 1 ? bg2 : bg1;
                nextLayer.style.backgroundImage = `url('${imagePath}')`;
                nextLayer.style.backgroundPositionY = config.positionY;
                nextLayer.offsetHeight;
                nextLayer.classList.add("bg-visible");
                currentLayer.classList.remove("bg-visible");
                activeLayer = activeLayer == 1 ? 2 : 1;
            }

            window.wallpaperPropertyListener = {
                applyUserProperties: function(properties) {
                    if (properties.version) {
                        myConfig.version = properties.version.value;
                    }
                    if (properties.dayhour) {
                        myConfig.dayHour = properties.dayhour.value;
                    }
                    if (properties.dayminute) {
                        myConfig.dayMinute = properties.dayminute.value;
                    }
                    if (properties.nighthour) {
                        myConfig.nightHour = properties.nighthour.value;
                    }
                    if (properties.nightminute) {
                        myConfig.nightMinute = properties.nightminute.value;
                    }
                    if (properties.positiony) {
                        myConfig.positionY = properties.positiony.value + "%";
                    }
                    if (properties.dawnhour) {
                        myConfig.dawnHour = properties.dawnhour.value;
                    }
                    if (properties.dawnminute) {
                        myConfig.dawnMinute = properties.dawnminute.value;
                    }
                    if (properties.dayhour4) {
                        myConfig.dayHour4 = properties.dayhour4.value;
                    }
                    if (properties.dayminute4) {
                        myConfig.dayMinute4 = properties.dayminute4.value;
                    }
                    if (properties.duskhour) {
                        myConfig.duskHour = properties.duskhour.value;
                    }
                    if (properties.duskminute) {
                        myConfig.duskMinute = properties.duskminute.value;
                    }
                    if (properties.nighthour4) {
                        myConfig.nightHour4 = properties.nighthour4.value;
                    }
                    if (properties.nightminute4) {
                        myConfig.nightMinute4 = properties.nightminute4.value;
                    }
                    changeBackground(myConfig);
                },
            };
        </script>
    </body>
</html>
